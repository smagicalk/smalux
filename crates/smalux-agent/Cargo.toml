[package]
name = "smalux-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
# Agent 异步运行时，负责采集任务、调度、网络连接和后台服务。
tokio = { version = "1.52.3", features = ["full"] }
# Tokio 官方扩展，提供 DelayQueue 与 CancellationToken。
tokio-util = { version = "0.7.18", features = ["time", "rt"] }
# Future 与 Stream 扩展，用于调度器异常捕获、定时队列和并发探测。
futures-util = "0.3.32"
# 异步 trait 支持，用于可类型擦除的调度 Task。
async-trait = "0.1.89"
# UTC 时间和 Cron 计划时间计算。
chrono = { version = "0.4.42", features = ["serde"] }
# IANA 时区支持，例如 Asia/Shanghai。
chrono-tz = { version = "0.10.4", features = ["serde"] }
# Cron 表达式解析与下一次运行时间计算。
croner = "3.0.1"
# URL 查询参数编解码，用于构造 token 等连接参数。
form_urlencoded = "1.2.2"
# Base64 编解码，用于二进制日志预览、终端数据和兼容协议。
base64 = "0.22.1"
# 跨平台 PTY 实现，用于远程交互式 shell。
portable-pty = "0.9.0"
# 命令行参数解析，用于 Agent 启动配置。
clap = { version = "4.6.1", features = ["derive"] }
# 人类可读时长解析，例如 5s、10m。
humantime = "2.4.0"
# 让 serde 支持人类可读时长字段。
humantime-serde = "1.1.1"
# 序列化基础能力，用于配置、采集数据和协议模型。
serde = { version = "1.0.228", features = ["derive"] }
# JSON 解析仅用于读取部分第三方公网 IP 服务的响应。
serde_json = "1.0.150"
# 结构化日志 API，记录 Agent 运行状态和诊断信息。
tracing = { version = "0.1.44", features = ["log", "std"] }
# tracing 日志订阅器，提供 RUST_LOG、JSON 和本地时间格式支持。
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "local-time"] }
# 应用边界的通用错误封装，用于附加错误上下文。
anyhow = { version = "1.0.103", features = ["default"] }
# 定义稳定的模块错误类型。
thiserror = { version = "2.0.18", features = ["default"] }
# 跨平台系统信息采集，用于 CPU、内存、磁盘、网络和进程指标。
sysinfo = { version = "0.39.6", features = ["default", "multithread"] }
# 跨平台 socket 统计，用于连接数量和详细连接信息采集。
netstat2 = "0.11.2"
# HTTP 客户端，用于公网 IP、HTTP 上报、探测和兼容端点。
reqwest = { version = "0.13.4", features = ["multipart", "hickory-dns"] }
# UUID 生成，用于 Agent 标识、任务和会话 ID。
uuid = { version = "1.23.4", features = ["v4", "serde"] }
# 项目公共基础库，复用日志、工具和跨 crate 类型。
smalux-core = { path = "../smalux-core" }
# Tokio 原生异步 ICMPv4/ICMPv6，实现多节点 Ping 且支持 Linux 非特权 DGRAM socket。
surge-ping = "0.9.0"

[dev-dependencies]
# 测试进程初始化钩子，用于测试环境的全局准备工作。
ctor = "1.0.8"
