syntax = "proto3";

package smalux.example.grpc.v1;

import "smalux/protocol/v1/core.proto";

// 仅用于 grpc_echo example 的双向流传输服务。
service ProtocolTransport {
  // 在单个 HTTP/2 双向流中交换完整 ClientFrame 和 ServerFrame 会话。
  rpc OpenSession(stream smalux.protocol.v1.ClientFrame)
      returns (stream smalux.protocol.v1.ServerFrame);
}
