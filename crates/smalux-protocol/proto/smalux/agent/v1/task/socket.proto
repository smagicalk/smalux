syntax = "proto3";

package smalux.agent.v1;

import "smalux/agent/v1/task/selection.proto";

// TCP/UDP Socket 采集的成本、协议族和结果数量配置。
message SocketTaskConfig {
  // SUMMARY/BASIC/DETAILED 控制只统计、枚举连接或额外关联 PID。
  CollectionMode mode = 1;
  // 选择 TCP、UDP 或两者。
  SocketProtocolSelection protocols = 2;
  // 选择 IPv4、IPv6 或两者。
  SocketAddressFamilySelection address_families = 3;
  // 最多返回的 Socket 条目数；缺失时使用 Agent 默认上限。
  optional uint32 max_entries = 4;
}

// Socket 传输协议筛选。
enum SocketProtocolSelection {
  // 未指定；Agent 使用默认协议集合。
  SOCKET_PROTOCOL_SELECTION_UNSPECIFIED = 0;
  // 同时采集 TCP 和 UDP。
  SOCKET_PROTOCOL_SELECTION_BOTH = 1;
  // 只采集 TCP。
  SOCKET_PROTOCOL_SELECTION_TCP = 2;
  // 只采集 UDP。
  SOCKET_PROTOCOL_SELECTION_UDP = 3;
}

// Socket 地址族筛选。
enum SocketAddressFamilySelection {
  // 未指定；Agent 使用默认地址族集合。
  SOCKET_ADDRESS_FAMILY_SELECTION_UNSPECIFIED = 0;
  // 同时采集 IPv4 和 IPv6。
  SOCKET_ADDRESS_FAMILY_SELECTION_BOTH = 1;
  // 只采集 IPv4。
  SOCKET_ADDRESS_FAMILY_SELECTION_IPV4 = 2;
  // 只采集 IPv6。
  SOCKET_ADDRESS_FAMILY_SELECTION_IPV6 = 3;
}

// TCP/UDP 总数、TCP 状态分布和可选连接明细。
message SocketSnapshot {
  // Agent 实际采用的采集成本模式。
  CollectionMode mode = 1;
  // 平台是否支持本次请求及不可用原因。
  SocketCollectionStatus status = 2;
  // 通过协议和地址族筛选的 TCP Socket 总数。
  uint32 tcp_total = 3;
  // 通过协议和地址族筛选的 UDP Socket 总数。
  uint32 udp_total = 4;
  // TCP Socket 按连接状态聚合的数量。
  repeated TcpStateCount tcp_states = 5;
  // BASIC/DETAILED 返回的 Socket 明细；SUMMARY 为空。
  repeated SocketEntry entries = 6;
  // true 表示可用条目超过 max_entries，entries 只返回前 N 项。
  bool truncated = 7;
}

// Socket 采集在当前平台的可用状态。
message SocketCollectionStatus {
  // 是否成功获得数据。
  SocketAvailability availability = 1;
  // 不可用或部分受限时的人类可读原因。
  optional string message = 2;
}

// Socket 采集可用性。
enum SocketAvailability {
  // 未指定，仅作为 Proto 零值。
  SOCKET_AVAILABILITY_UNSPECIFIED = 0;
  // 当前平台和权限允许完成采集。
  SOCKET_AVAILABILITY_AVAILABLE = 1;
  // 平台 API、权限或运行环境不支持采集。
  SOCKET_AVAILABILITY_UNAVAILABLE = 2;
}

// 单个 TCP 或 UDP Socket 的地址与可选进程关联。
message SocketEntry {
  // TCP 或 UDP。
  SocketProtocol protocol = 1;
  // IPv4 或 IPv6。
  SocketAddressFamily address_family = 2;
  // 本地绑定 IP 的标准文本形式。
  string local_address = 3;
  // 本地端口，范围 0..65535；零可能表示尚未分配。
  uint32 local_port = 4;
  // 已连接 TCP/UDP 的远端地址；监听或无连接 Socket 缺失。
  optional string remote_address = 5;
  // 已连接 Socket 的远端端口；不适用时缺失。
  optional uint32 remote_port = 6;
  // TCP 连接状态；UDP 时缺失。
  optional TcpConnectionState tcp_state = 7;
  // DETAILED 模式下与该 Socket 关联的 PID，可能有多个。
  repeated uint32 associated_pids = 8;
  // false 表示本模式或平台未尝试关联 PID，不能把空数组解释为“无进程”。
  bool pids_included = 9;
}

// 实际 Socket 传输协议。
enum SocketProtocol {
  // 未指定，仅作为 Proto 零值。
  SOCKET_PROTOCOL_UNSPECIFIED = 0;
  // 传输控制协议。
  SOCKET_PROTOCOL_TCP = 1;
  // 用户数据报协议。
  SOCKET_PROTOCOL_UDP = 2;
}

// 实际 Socket 地址族。
enum SocketAddressFamily {
  // 未指定，仅作为 Proto 零值。
  SOCKET_ADDRESS_FAMILY_UNSPECIFIED = 0;
  // IPv4。
  SOCKET_ADDRESS_FAMILY_IPV4 = 1;
  // IPv6。
  SOCKET_ADDRESS_FAMILY_IPV6 = 2;
}

// 一种 TCP 状态的聚合数量。
message TcpStateCount {
  // 标准化 TCP 连接状态。
  TcpConnectionState state = 1;
  // 处于该状态的 TCP Socket 数量。
  uint32 count = 2;
}

// 跨平台标准化的 TCP 状态机状态。
enum TcpConnectionState {
  // 未指定，仅作为 Proto 零值。
  TCP_CONNECTION_STATE_UNSPECIFIED = 0;
  // 已关闭。
  TCP_CONNECTION_STATE_CLOSED = 1;
  // 正在监听入站连接。
  TCP_CONNECTION_STATE_LISTEN = 2;
  // 已发送 SYN，等待响应。
  TCP_CONNECTION_STATE_SYN_SENT = 3;
  // 已收到 SYN 并发送响应，等待最终 ACK。
  TCP_CONNECTION_STATE_SYN_RECEIVED = 4;
  // 连接已建立，可双向传输数据。
  TCP_CONNECTION_STATE_ESTABLISHED = 5;
  // 主动关闭后的第一等待阶段。
  TCP_CONNECTION_STATE_FIN_WAIT1 = 6;
  // 主动关闭后的第二等待阶段。
  TCP_CONNECTION_STATE_FIN_WAIT2 = 7;
  // 已收到远端 FIN，等待本地关闭。
  TCP_CONNECTION_STATE_CLOSE_WAIT = 8;
  // 双方同时关闭，等待最终 ACK。
  TCP_CONNECTION_STATE_CLOSING = 9;
  // 已发送本地 FIN，等待最终 ACK。
  TCP_CONNECTION_STATE_LAST_ACK = 10;
  // 主动关闭后等待旧报文过期。
  TCP_CONNECTION_STATE_TIME_WAIT = 11;
  // Windows 内核删除 TCB 的过渡状态。
  TCP_CONNECTION_STATE_DELETE_TCB = 12;
  // Agent 无法映射的平台特有状态。
  TCP_CONNECTION_STATE_UNKNOWN = 13;
}
