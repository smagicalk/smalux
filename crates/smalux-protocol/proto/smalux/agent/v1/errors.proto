syntax = "proto3";

// 握手外层错误和 Noise 密文内业务错误的版本化定义。
package smalux.agent.v1;

// Noise 建立前可通过 ProtocolFrame.protocol_error 返回的粗粒度错误码。
// 这些错误在网络上可见，因此只能表达通用分类。
enum ProtocolErrorCode {
  // 未设置错误码；接收方应按未知协议错误处理。
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;

  // 外层帧缺失 body，或当前阶段收到不允许的帧类型。
  PROTOCOL_ERROR_CODE_INVALID_FRAME = 1;

  // 握手类型未知，或当前 Server 不支持请求的 Noise pattern。
  PROTOCOL_ERROR_CODE_UNSUPPORTED_HANDSHAKE = 2;

  // 对端没有在配置时间内发送下一条握手消息。
  PROTOCOL_ERROR_CODE_HANDSHAKE_TIMEOUT = 3;

  // PSK、静态公钥或 Noise transcript 验证失败；不得指出具体失败凭据。
  PROTOCOL_ERROR_CODE_AUTHENTICATION_FAILED = 4;

  // IK 指定的 responder key ID 不在 Server 当前活跃 keyring 中。
  PROTOCOL_ERROR_CODE_UNKNOWN_KEY_ID = 5;
}

// Noise 尚未建立时返回的明文通用错误。
message ProtocolError {
  // 稳定机器错误码，Client 应主要依据该字段决定是否重试。
  ProtocolErrorCode code = 1;

  // 只允许不包含 Token、密钥或业务内容的通用描述。
  string message = 2;
}

// Noise 已建立后通过 SecureMessage.error 返回的加密业务错误码。
enum SecureErrorCode {
  // 未设置或无法识别的加密业务错误。
  SECURE_ERROR_CODE_UNSPECIFIED = 0;

  // Token 不存在、格式错误或不匹配当前注册请求。
  SECURE_ERROR_CODE_INVALID_TOKEN = 1;

  // 一次性 Token 已被成功注册消费，不能再次使用。
  SECURE_ERROR_CODE_TOKEN_ALREADY_USED = 2;

  // Agent 静态公钥未注册、已撤销或没有当前业务操作权限。
  SECURE_ERROR_CODE_AGENT_NOT_AUTHORIZED = 3;

  // 相同 Agent 名称或公钥已经完成注册。
  SECURE_ERROR_CODE_AGENT_ALREADY_REGISTERED = 4;

  // SecureMessage body、oneof 分支或字段值不符合当前会话阶段。
  SECURE_ERROR_CODE_INVALID_MESSAGE = 5;

  // 已有长期密钥轮换事务进行中，不能并发开始另一笔轮换。
  SECURE_ERROR_CODE_ROTATION_CONFLICT = 6;

  // 确认消息的 rotation ID 与本地 pending 事务不一致。
  SECURE_ERROR_CODE_ROTATION_ID_MISMATCH = 7;

  // 持久化 snapshot 中的 pending、previous 或事务 ID 组合不合法。
  SECURE_ERROR_CODE_INVALID_ROTATION_STATE = 8;

  // Server 内部或存储失败；不得在 message 中暴露路径、密钥或数据库细节。
  SECURE_ERROR_CODE_INTERNAL = 9;
}

// 只在已经建立的 Noise transport mode 内发送的加密错误。
message SecureError {
  // 稳定业务错误码。
  SecureErrorCode code = 1;

  // 供诊断的非敏感描述；即使已加密，也不应包含 Token 或私钥。
  string message = 2;
}
