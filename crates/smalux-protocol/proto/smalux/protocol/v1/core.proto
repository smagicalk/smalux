syntax = "proto3";

package smalux.protocol.v1;

import "google/protobuf/any.proto";

// Client 发送的最外层协议帧。
message ClientFrame {
  // ClientFrame 当前携带的唯一消息体。
  oneof body {
    // Client 发起协议与安全能力协商。
    ClientHello hello = 1;
    // Client 发送安全实现定义的握手载荷。
    SecurityHandshake security_handshake = 2;
    // 仅供不保护内容的安全方案传输会话内容。
    SessionContent plaintext_content = 3;
    // 由协商后的安全会话保护的会话内容。
    ProtectedPayload protected_payload = 4;
  }
}

// Server 发送的最外层协议帧。
message ServerFrame {
  // ServerFrame 当前携带的唯一消息体。
  oneof body {
    // Server 返回最终协议与安全协商结果。
    ServerHello hello = 1;
    // Server 发送安全实现定义的握手载荷。
    SecurityHandshake security_handshake = 2;
    // 仅供不保护内容的安全方案传输会话内容。
    SessionContent plaintext_content = 3;
    // 由协商后的安全会话保护的会话内容。
    ProtectedPayload protected_payload = 4;
  }
}

// 一个 Major 版本支持的连续 Minor 范围。
message VersionRange {
  // 主版本号。
  uint32 major = 1;
  // 支持的最小次版本号，包含该值。
  uint32 min_minor = 2;
  // 支持的最大次版本号，包含该值。
  uint32 max_minor = 3;
}

// 协商完成后的精确协议版本。
message ProtocolVersion {
  // 最终主版本号。
  uint32 major = 1;
  // 最终次版本号。
  uint32 minor = 2;
}

// Client 首次发送的能力声明。
message ClientHello {
  // Client 支持的协议版本范围。
  repeated VersionRange supported_versions = 1;
  // Client 可选支持的能力名称。
  repeated string supported_capabilities = 2;
  // Server 必须支持的能力名称，否则协商失败。
  repeated string required_capabilities = 3;
  // Client 支持的安全方案稳定名称。
  repeated string supported_security_schemes = 4;
  // Client 本地允许接收的最大 Frame 字节数。
  uint32 max_frame_bytes = 5;
  // 当前连接生成的 32 字节随机数。
  bytes nonce = 6;
}

// Server 返回的最终协商结果。
message ServerHello {
  // Server 选择的唯一协议版本。
  ProtocolVersion selected_version = 1;
  // 双方最终启用的能力集合。
  repeated string selected_capabilities = 2;
  // Server 按本地优先级选择的安全方案。
  string selected_security_scheme = 3;
  // 双方 Frame 上限的较小值。
  uint32 max_frame_bytes = 4;
  // Server 为当前连接分配的 16 字节会话标识。
  bytes session_id = 5;
  // Server 为当前连接生成的 32 字节随机数。
  bytes nonce = 6;
}

// 安全实现需要认证的规范化协商结果，避免绑定未知 Hello 字段。
message NegotiationTranscript {
  // 最终协议版本。
  ProtocolVersion version = 1;
  // 最终启用的能力集合。
  repeated string capabilities = 2;
  // 最终安全方案稳定名称。
  string security_scheme = 3;
  // 最终 Frame 字节上限。
  uint32 max_frame_bytes = 4;
  // 当前连接的 16 字节会话标识。
  bytes session_id = 5;
  // 原始 ClientHello 中的 32 字节随机数。
  bytes client_nonce = 6;
  // 原始 ServerHello 中的 32 字节随机数。
  bytes server_nonce = 7;
}

// 具体安全实现交换的不透明握手数据。
message SecurityHandshake {
  // 必须与 ServerHello 选择结果完全一致的安全方案名称。
  string scheme = 1;
  // 从零开始、跨两个方向严格递增的握手步骤。
  uint32 step = 2;
  // 具体安全算法定义的不透明握手字节。
  bytes payload = 3;
}

// 应用层加密后的不透明会话内容。
message ProtectedPayload {
  // 安全实现输出的不透明认证密文。
  bytes ciphertext = 1;
}

// 完成握手后可交换的会话内容。
message SessionContent {
  // 握手完成后当前 Frame 携带的唯一会话消息。
  oneof body {
    // 任意业务 Protobuf 消息的统一信封。
    ApplicationEnvelope application = 1;
    // 会话层存活探测请求。
    Ping ping = 2;
    // 会话层存活探测响应。
    Pong pong = 3;
    // 可关联业务请求的结构化协议错误。
    ProtocolError error = 4;
    // 正常或异常会话关闭通知。
    Close close = 5;
  }
}

// 承载具体业务 Protobuf 消息的通用信封。
message ApplicationEnvelope {
  // 当前业务消息的 16 字节唯一标识。
  bytes message_id = 1;
  // 可选的 16 字节原请求消息标识。
  optional bytes correlation_id = 2;
  // 当前发送方向从 1 开始连续递增的序号。
  uint64 sequence = 3;
  // 发送方生成消息时的 Unix 毫秒时间，仅用于观测。
  uint64 sent_at_unix_ms = 4;
  // 使用稳定 type URL 标识的具体业务消息。
  google.protobuf.Any payload = 5;
}

// 会话层存活探测请求。
message Ping {
  // 由请求方生成并要求 Pong 原样回显的随机值。
  uint64 nonce = 1;
  // 请求方发送 Ping 时的 Unix 毫秒时间。
  uint64 sent_at_unix_ms = 2;
}

// 对 Ping 的响应，原样回显 nonce。
message Pong {
  // 原样回显对应 Ping 的 nonce。
  uint64 nonce = 1;
  // 响应方收到 Ping 时的 Unix 毫秒时间。
  uint64 received_at_unix_ms = 2;
  // 响应方发送 Pong 时的 Unix 毫秒时间。
  uint64 sent_at_unix_ms = 3;
}

// 稳定的协议错误分类。
enum ProtocolErrorCode {
  // 未提供明确错误分类。
  PROTOCOL_ERROR_CODE_UNSPECIFIED = 0;
  // Frame 或 Protobuf 内容格式不合法。
  PROTOCOL_ERROR_CODE_MALFORMED_FRAME = 1;
  // 双方没有可用的公共协议版本。
  PROTOCOL_ERROR_CODE_UNSUPPORTED_VERSION = 2;
  // 必需能力缺失或能力协商不一致。
  PROTOCOL_ERROR_CODE_CAPABILITY_MISMATCH = 3;
  // 安全方案协商、握手或身份校验失败。
  PROTOCOL_ERROR_CODE_SECURITY_NEGOTIATION_FAILED = 4;
  // 消息不允许出现在当前会话状态。
  PROTOCOL_ERROR_CODE_INVALID_STATE = 5;
  // 消息数量或字节数超过协议限制。
  PROTOCOL_ERROR_CODE_LIMIT_EXCEEDED = 6;
  // 当前方向 sequence 重复、回退或跳号。
  PROTOCOL_ERROR_CODE_SEQUENCE_ERROR = 7;
  // 接收方不支持指定业务消息类型。
  PROTOCOL_ERROR_CODE_UNSUPPORTED_MESSAGE = 8;
  // 接收方内部错误。
  PROTOCOL_ERROR_CODE_INTERNAL = 9;
}

// 可发送给对端的结构化协议错误。
message ProtocolError {
  // 稳定错误分类。
  ProtocolErrorCode code = 1;
  // 便于日志与诊断的有限长度错误摘要。
  string message = 2;
  // 是否必须立即终止当前协议会话。
  bool fatal = 3;
  // 可选的 16 字节关联业务消息标识。
  optional bytes correlation_id = 4;
}

// 会话关闭原因。
enum CloseCode {
  // 未提供明确关闭分类。
  CLOSE_CODE_UNSPECIFIED = 0;
  // 双方按预期完成工作。
  CLOSE_CODE_NORMAL = 1;
  // 一方正在退出、重启或离开。
  CLOSE_CODE_GOING_AWAY = 2;
  // 因协议格式或状态错误关闭。
  CLOSE_CODE_PROTOCOL_ERROR = 3;
  // 因本地安全、身份或业务策略拒绝关闭。
  CLOSE_CODE_POLICY_REJECTED = 4;
  // 因本地内部错误关闭。
  CLOSE_CODE_INTERNAL = 5;
}

// 主动关闭会话时发送的最后一条内容。
message Close {
  // 稳定关闭分类。
  CloseCode code = 1;
  // 便于日志与诊断的有限长度关闭原因。
  string reason = 2;
  // 对端是否适合在退避后重新连接。
  bool retryable = 3;
}
