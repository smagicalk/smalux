[package]
name = "smalux-protocol"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[example]]
name = "noise_shared_port_client"
path = "examples/noise_shared_port/client/main.rs"

[[example]]
name = "noise_shared_port_server"
path = "examples/noise_shared_port/server/main.rs"

[dependencies]
# gRPC 交互消息的 Protocol Buffers 编解码实现。
prost = "0.14.4"
# Protobuf 官方 Timestamp、Duration 等通用消息。
prost-types = "0.14.4"
# 生成的 gRPC Client/Server 公共类型。
tonic = { version = "0.14.6", features = ["transport", "tls-native-roots"] }
# Tonic 0.14 的 Prost 消息 Codec。
tonic-prost = "0.14.6"
# Noise XXpsk3/IK 握手和 transport mode 加密。
snow = "0.10.0"
# 公钥生成稳定 key ID。
blake2 = "0.10.6"
# 生成轮换 ID 和 Noise 静态密钥所需随机数。
getrandom = "0.3.4"
# Tonic 双向流、超时、心跳和会话 actor。
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
# Endpoint URI 错误作为稳定 transport error 暴露。
http = "1.4.0"
# 协议层结构化日志；初始化由宿主进程决定，协议只负责产生多级日志事件。
tracing = "0.1.44"

[build-dependencies]
# 配置 Protobuf 代码生成器。
prost-build = "0.14.4"
# 内置各平台 protoc，避免构建机器额外安装系统工具。
protoc-bin-vendored = "3.2.0"
# 生成 Tonic Client/Server 交互类型。
tonic-prost-build = "0.14.6"

[dev-dependencies]
# 将普通 HTTP 路由和生成的 Tonic Router 合并到同一监听端口。
axum = { version = "0.8.9", features = ["http1", "http2", "ws"] }
# `tls-aws-lc` 用于本地自签 TLS，`tls-native-roots` 用于 Cloudflare 等公开 HTTPS 入口。
tonic = { version = "0.14.6", features = ["transport", "tls-aws-lc", "tls-native-roots"] }
