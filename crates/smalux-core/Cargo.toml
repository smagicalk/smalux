[package]
name = "smalux-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# 公共异步基础能力，供日志、网络和共享工具使用。
tokio = { version = "1.52.3", features = ["default"] }
# 公共结构的序列化与反序列化能力。
serde = { version = "1.0.228", features = ["derive"] }
# 公共 JSON 编解码和脱敏工具基础能力。
serde_json = { version = "1.0.150", features = ["default"] }
# JSONPath 查询，用于通用结构化数据处理。
serde_json_path = { version = "0.7.2", features = ["default"] }
# 应用边界的通用错误封装和上下文补充。
anyhow = { version = "1.0.103", features = ["default"] }
# 公共模块的明确错误类型定义。
thiserror = { version = "2.0.18", features = ["default"] }
# 项目统一的结构化日志 API。
tracing = { version = "0.1.44", features = ["log", "std"] }
# 日志过滤、格式化、JSON 输出和本地时间支持。
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "local-time"] }
# 非阻塞日志文件写入支持。
tracing-appender = "0.2.5"
# 按日期和文件大小滚动并保留指定数量日志文件。
tracing-rolling-file = { version = "0.1.3", features = ["non-blocking"] }
# 公共 HTTP 客户端能力，用于网络工具和外部请求。
reqwest = { version = "0.13.4", features = ["default", "rustls", "hickory-dns", "multipart"] }
# 异步 DNS 解析，用于公共网络工具和探测能力。
hickory-resolver = { version = "0.26.1", features = ["default", "tokio"] }
once_cell = "1.21.4"
