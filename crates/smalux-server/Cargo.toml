[package]
name = "smalux-server"
version = "0.1.0"
edition = "2024"

[features]
# 编译期内置前端资源，适合发布单文件 server。
frontend-embed = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
# Server 异步运行时，承载 HTTP、数据库和后台任务。
tokio = { version = "1.52.3", features = ["full"] }
# Tokio 扩展工具，用于 codec、IO、超时和取消控制。
tokio-util = { version = "0.7.18", features = ["codec", "io", "io-util", "time", "rt"] }
# HTTP 服务框架，用于管理 API 和后续 gRPC 路由装配。
axum = { version = "0.8.9", features = ["http2", "macros", "multipart"] }
# Axum 扩展能力，提供 typed header、cookie、文件流和增强路由。
axum-extra = { version = "0.12.6", features = ["async-read-body", "attachment", "cached", "cookie", "cookie-key-expansion", "cookie-private", "cookie-signed", "erased-json", "error-response", "file-stream", "form", "handler", "json-deserializer", "json-lines", "middleware", "multipart", "optional-path", "query", "routing", "scheme", "typed-header", "typed-routing", "with-rejection"] }
# 通用 Service 中间件，用于超时、重试、缓冲、限流和负载保护。
tower = { version = "0.5.3", features = ["full"] }
# HTTP 专用中间件，用于 trace、CORS、压缩、request ID 和静态文件。
tower-http = { version = "0.7.0", features = ["full"] }
# 基于 governor 的 Axum 限流中间件。
tower_governor = { version = "0.8.0", default-features = false, features = ["axum", "tracing"] }
# Web 管理端会话中间件，支持签名和私密 cookie。
tower-sessions = { version = "0.15.0", features = ["signed", "private"] }
# Server 命令行参数与环境变量解析。
clap = { version = "4.6.1", features = ["derive", "env", "unicode", "wrap_help"] }
# CLI 使用人类可读时长，例如 30m、24h 和 7d。
humantime = "2.4.0"
# API DTO、配置和数据库模型的序列化基础能力。
serde = { version = "1.0.228", features = ["derive"] }
# HTTP API、配置 patch 和数据库 JSON 字段的编解码。
serde_json = "1.0.150"
# Server 结构化日志 API。
tracing = { version = "0.1.44", features = ["log", "std"] }
# ORM 与数据库连接，支持 SQLite、PostgreSQL 和 MySQL。
sea-orm = { version = "2.0.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "macros", "with-json", "with-chrono", "with-time", "with-uuid", "sqlite-use-returning-for-3_35"] }
# SeaORM 迁移运行时，用于启动时执行数据库 schema 升级。
sea-orm-migration = { version = "2.0.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "with-json", "with-chrono", "with-time", "with-uuid", "sqlite-use-returning-for-3_35"] }
# SQL 构建器，用于动态查询、复杂条件和迁移辅助。
sea-query = { version = "1.0.1", default-features = false, features = ["derive", "backend-sqlite", "backend-postgres", "backend-mysql", "serde", "with-json", "with-chrono", "with-time", "with-uuid", "sea-orm"] }
# 启动和应用边界的通用错误封装。
anyhow = { version = "1.0.103", features = ["default"] }
# Server 各模块的明确错误类型定义。
thiserror = { version = "2.0.18", features = ["default"] }
# 在 trait 中定义异步方法，用于 service 和 repository 接口。
async-trait = "0.1.89"
# URL 查询参数编解码，用于数据库连接参数和 API query。
form_urlencoded = "1.2.2"
# 标准 HTTP 类型，供 Axum、Tower 和自定义中间件共享。
http = "1.4.2"
# 强类型 HTTP header，用于认证和请求上下文。
headers = "0.4.1"
# 请求 DTO 和配置 patch 的声明式校验。
validator = { version = "0.20.0", features = ["derive"] }
# 生成和序列化连接、命令、任务等服务端 ID。
uuid = { version = "1.23.4", features = ["v4", "serde"] }
# 使用操作系统密码学随机源生成注册 Token ID 和 XXpsk3 PSK。
getrandom = "0.3.4"
# 时间处理与序列化，用于数据库字段、过期时间和 API 输出。
time = { version = "0.3.53", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }
# URL 构造与编码，用于数据库连接地址和外部链接。
url = "2.5.8"
# 敏感值包装，避免 token、secret 和 PSK 被 Debug 或日志泄露。
secrecy = { version = "0.10.3", features = ["serde"] }
# 编译期嵌入前端资源，仅在 frontend-embed feature 开启时使用。
rust-embed = { version = "8.12.0", optional = true }
# 根据资源文件名推断 Content-Type，仅用于内嵌前端资源。
mime_guess = { version = "2.0.5", optional = true }
# 项目公共基础库，复用日志、工具和跨 crate 类型。
smalux-core = { path = "../smalux-core" }
# 项目协议库
smalux-protocol = { path = "../smalux-protocol"}
# Server 只解析 Plus Schema 契约，不安装或执行 Plus Worker。
smalux-plus-core = { path = "../smalux-plus/smalux-plus-core" }
# Echo 示例需要直接调用 Prost 的 Message 编解码 trait。
prost = "0.14.4"
tonic = "0.14.6"
# Noise XXpsk3/IK 握手和 transport mode 加密。
snow = "0.10.0"

[dev-dependencies]
# 测试二进制启动时提前安装全局 tracing subscriber。
ctor = "1.0.8"
# 使用正式 Agent Client 验证 Token 注册、状态落盘和 IK 重连链路。
smalux-agent = { path = "../smalux-agent" }
# 构造真实 FileDescriptorSet，验证 Plus Schema 数据库和缓存闭环。
prost-types = "0.14.4"

[target.'cfg(windows)'.dependencies]
# 为本地管理命名管道设置仅本机所有者/管理员可访问的 ACL。
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory"] }
